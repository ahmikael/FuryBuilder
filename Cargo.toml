[workspace]
resolver = "2"
members = [
    "crates/world-domain",
    "crates/world-operations",
    "crates/world-io",
    "crates/world-generation",
    "crates/world-application",
    "crates/project-store",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
