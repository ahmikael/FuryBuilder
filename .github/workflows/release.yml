name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows beta release
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag and application version
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Release tags must look like vX.Y.Z, got '$tag'."
          }
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          if ($Matches[1] -ne $version) {
            throw "Tag $tag does not match version.json ($version). Run pnpm version:set before tagging."
          }
          pnpm version:check
          if ($LASTEXITCODE -ne 0) { throw "Version consistency check failed." }

      - name: Release notes tool tests
        run: pnpm test:release-notes

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Frontend tests
        run: pnpm test

      - name: Frontend production build
        run: pnpm build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: License policy
        run: pnpm licenses:check

      - name: Release evidence validators
        run: |
          python scripts/test_release_process.py
          python scripts/test_release_security.py
          python scripts/test_system_requirements.py
          python scripts/test_known_limitations.py
          python scripts/test_clean_setup.py
          python scripts/test_release_workflow.py

      - name: Generate release notes from conventional commits
        shell: pwsh
        run: |
          node scripts/release-notes.mjs --tag $env:RELEASE_TAG --output release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "Release notes generation failed." }

      - name: Load release notes for the updater manifest
        id: notes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            core.setOutput("body", fs.readFileSync("release-notes.md", "utf8"));

      - name: Create draft release
        id: draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (-not $release.isDraft) {
              throw "Release $tag is already published. Bump the version instead of overwriting it."
            }
            gh release delete $tag --yes
            if ($LASTEXITCODE -ne 0) { throw "Could not replace the existing draft release $tag." }
          }
          gh release create $tag --draft --verify-tag `
            --title "FuryBuilder $tag" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "Could not create the draft release." }
          $id = gh release view $tag --json databaseId --jq .databaseId
          if ($LASTEXITCODE -ne 0) { throw "Could not read the draft release id." }
          "id=$id" >> $env:GITHUB_OUTPUT

      - name: Build Windows installers and updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ steps.draft.outputs.id }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: FuryBuilder ${{ env.RELEASE_TAG }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          tauriScript: pnpm tauri
          args: --bundles nsis,msi

      - name: Verify updater manifest and signatures
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $assets = @(gh release view $env:RELEASE_TAG --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw "Could not read release assets." }
          $required = @(
            "latest.json",
            "FuryBuilder_${version}_x64-setup.exe",
            "FuryBuilder_${version}_x64-setup.exe.sig",
            "FuryBuilder_${version}_x64_en-US.msi",
            "FuryBuilder_${version}_x64_en-US.msi.sig"
          )
          foreach ($asset in $required) {
            if ($assets -notcontains $asset) {
              throw "Release asset '$asset' is missing. Auto-update or the documented installer set would be incomplete."
            }
          }
          Write-Output ("Assets: " + ($assets -join ", "))

      - name: Add checksums and publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $installers = @(
            Get-ChildItem "target/release/bundle/nsis/FuryBuilder_${version}_x64-setup.exe" -ErrorAction SilentlyContinue
            Get-ChildItem "target/release/bundle/msi/FuryBuilder_${version}_x64_en-US.msi" -ErrorAction SilentlyContinue
          )
          if ($installers.Count -ne 2) {
            throw "Expected exactly the NSIS and MSI installers for version $version, found $($installers.Count)."
          }

          $lines = @("", "## SHA-256", "")
          foreach ($file in $installers) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$($file.Name)"
            $lines += "- [$($file.Name)]($url) - ``$hash``"
          }
          Add-Content -Path release-notes.md -Value ($lines -join "`n") -Encoding utf8

          gh release edit $tag --notes-file release-notes.md --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the release." }

          $url = gh release view $tag --json url --jq .url
          Write-Output "Published $tag at $url"
