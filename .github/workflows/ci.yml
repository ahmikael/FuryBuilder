name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: TypeScript + Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Version consistency
        run: pnpm version:check

      - name: Release notes tool tests
        run: pnpm test:release-notes

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Oxlint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: Frontend tests
        run: pnpm test

      - name: Frontend production build
        run: pnpm build

      - name: Demo project and screenshots
        run: python scripts/test_demo_assets.py

      - name: Java server import/export evidence
        run: python scripts/test_java_server_interop.py

      - name: System requirements and limitations
        run: |
          python scripts/test_system_requirements.py
          python scripts/test_known_limitations.py

      - name: Clean setup evidence
        run: python scripts/test_clean_setup.py

      - name: Release workflow and updater configuration
        run: python scripts/test_release_workflow.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: License policy
        run: pnpm licenses:check

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Stage the MCP sidecar
        run: node scripts/build-mcp-sidecar.mjs --debug

      - name: Rust workspace build
        run: cargo build --workspace
