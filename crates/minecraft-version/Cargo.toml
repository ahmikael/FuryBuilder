[package]
name = "furybuilder-minecraft-version"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Minecraft Java version identities, profiles and support capabilities for FuryBuilder"

[lib]
name = "minecraft_version"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
flate2 = { workspace = true }
sha1 = { workspace = true }
thiserror = { workspace = true }
download-pipeline = { path = "../download-pipeline", package = "furybuilder-download-pipeline" }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
