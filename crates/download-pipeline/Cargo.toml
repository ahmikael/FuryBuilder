[package]
name = "furybuilder-download-pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Allowlisted, verified, retryable HTTPS downloads for FuryBuilder components"

[lib]
name = "download_pipeline"

[dependencies]
sha1 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
ureq = { version = "2.12", default-features = false, features = ["tls", "proxy-from-env"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
