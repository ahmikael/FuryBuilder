[package]
name = "furybuilder-world-application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "FuryBuilder application facade: commands, queries, policy and jobs"
[lib]
name = "world_application"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
world-domain = { path = "../world-domain", package = "furybuilder-world-domain" }
world-operations = { path = "../world-operations", package = "furybuilder-world-operations" }
minecraft-version = { path = "../minecraft-version", package = "furybuilder-minecraft-version" }
workspace-model = { path = "../workspace-model", package = "furybuilder-workspace-model" }
scene-model = { path = "../scene-model", package = "furybuilder-scene-model" }
build-dsl = { path = "../build-dsl", package = "furybuilder-build-dsl" }
observation = { path = "../observation", package = "furybuilder-observation" }
validation = { path = "../validation", package = "furybuilder-validation" }

[[bench]]
name = "world_ops"
harness = false
