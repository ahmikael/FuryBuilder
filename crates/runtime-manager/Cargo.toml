[package]
name = "furybuilder-runtime-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Discovery and managed caching of Minecraft Java runtimes"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
download-pipeline = { path = "../download-pipeline", package = "furybuilder-download-pipeline" }
minecraft-version = { path = "../minecraft-version", package = "furybuilder-minecraft-version" }
world-io = { path = "../world-io", package = "furybuilder-world-io" }
flate2 = { workspace = true }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
flate2 = { workspace = true }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
