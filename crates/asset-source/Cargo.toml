[package]
name = "furybuilder-asset-source"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Read-only discovery and validation of local Minecraft Java assets for FuryBuilder"

[lib]
name = "asset_source"

[dependencies]
base64 = { workspace = true }
component-model = { path = "../component-model", package = "furybuilder-component-model" }
flate2 = { workspace = true }
png = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tempfile = "3"
minecraft-version = { path = "../minecraft-version", package = "furybuilder-minecraft-version" }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
