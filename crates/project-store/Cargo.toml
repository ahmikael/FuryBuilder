[package]
name = "furybuilder-project-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Atomic, versioned FuryBuilder project folders with snapshots and crash recovery"
[lib]
name = "project_store"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
minecraft-version = { path = "../minecraft-version", package = "furybuilder-minecraft-version" }
world-domain = { path = "../world-domain", package = "furybuilder-world-domain" }
workspace-model = { path = "../workspace-model", package = "furybuilder-workspace-model" }
scene-model = { path = "../scene-model", package = "furybuilder-scene-model" }
