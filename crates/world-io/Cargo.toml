[package]
name = "furybuilder-world-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Versioned NBT, structure, Sponge and Anvil adapters for FuryBuilder"
[lib]
name = "world_io"

[dependencies]
flate2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
world-domain = { path = "../world-domain", package = "furybuilder-world-domain" }
minecraft-version = { path = "../minecraft-version", package = "furybuilder-minecraft-version" }

[dev-dependencies]
serde_json = { workspace = true }
asset-source = { path = "../asset-source", package = "furybuilder-asset-source" }
project-store = { path = "../project-store", package = "furybuilder-project-store" }
