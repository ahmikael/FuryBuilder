[package]
name = "furybuilder-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "FuryBuilder Tauri desktop shell"

[lib]
name = "furybuilder_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
interprocess = { workspace = true }
project-store = { path = "../../../crates/project-store", package = "furybuilder-project-store" }
asset-source = { path = "../../../crates/asset-source", package = "furybuilder-asset-source" }
world-application = { path = "../../../crates/world-application", package = "furybuilder-world-application" }
world-domain = { path = "../../../crates/world-domain", package = "furybuilder-world-domain" }
world-io = { path = "../../../crates/world-io", package = "furybuilder-world-io" }
